# Static-host config for a self-hosted Stayput. It does what vercel.json does on stayput.dev:
# clean URLs, the permanent redirects, the cache rules and the security headers (CSP included).
# redirects.conf, security-headers.conf and cache-locations.conf are generated from vercel.json
# at image build time by scripts/nginx-conf.mjs.

server_tokens off;
# Redirect with a path only, so the browser keeps whatever host and port it used (the container listens on 80, the host port can differ).
absolute_redirect off;
charset utf-8;
charset_types text/html text/css text/javascript application/json application/manifest+json application/xml text/plain image/svg+xml;

gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css text/javascript application/javascript application/json
           application/manifest+json application/wasm application/xml image/svg+xml image/x-icon;

server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The site's own list of file types. wasm must be application/wasm and .mjs JavaScript.
  types {
    text/html html;
    text/css css;
    text/javascript js mjs;
    application/json json;
    application/manifest+json webmanifest;
    application/wasm wasm;
    application/xml xml;
    text/plain txt md;
    image/png png;
    image/jpeg jpg jpeg;
    image/webp webp;
    image/gif gif;
    image/svg+xml svg;
    image/x-icon ico;
    font/woff2 woff2;
    font/ttf ttf;
    video/mp4 mp4;
    video/webm webm;
    application/gzip gz;
    application/octet-stream onnx tflite;
  }
  default_type application/octet-stream;

  # Unknown paths get the site's own 404 page.
  error_page 404 /404.html;
  location = /404.html {
    internal;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    include /etc/nginx/stayput/security-headers.conf;
  }

  # Permanent redirects from the old paths.
  include /etc/nginx/stayput/redirects.conf;

  # Cache rules (assets, vendor, models, fonts, media, sw.js).
  include /etc/nginx/stayput/cache-locations.conf;

  # trailingSlash: false. /tools/x/ goes to /tools/x.
  location ~ ^/(.+)/$ {
    return 308 /$1$is_args$args;
  }

  location = / {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    include /etc/nginx/stayput/security-headers.conf;
    try_files /index.html =404;
  }

  # Clean URLs: /tools/x serves tools/x.html. (A bare directory such as /models has no page, so
  # it is a 404 rather than the 403 nginx would give for a directory without an index file.)
  location / {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    include /etc/nginx/stayput/security-headers.conf;
    try_files $uri $uri.html =404;
  }
}
