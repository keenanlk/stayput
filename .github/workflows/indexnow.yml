name: IndexNow

# After a production deploy (the deploy-production job in ci.yml calls this), tell Bing and
# other IndexNow engines to recrawl the site. Skipped when the deploy changed no site files.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      all:
        description: Resubmit every URL in the sitemap (use rarely; off submits only the changed pages)
        type: boolean
        default: false
      from:
        description: Diff mode, base revision (default HEAD~1)
        type: string
        default: ''
      to:
        description: Diff mode, head revision (default HEAD)
        type: string
        default: ''

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # A manual run may diff an older revision, so it needs the history.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 0 || 2 }}
      - id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || git diff --name-only HEAD~1 HEAD | grep -qE '^(src/|public/|astro\.config|vercel\.json)'; then
            echo "site=true" >> "$GITHUB_OUTPUT"
          else
            echo "No site files changed; skipping."
          fi
      - uses: actions/setup-node@v7
        if: steps.changed.outputs.site == 'true'
        with:
          node-version-file: .nvmrc
      # Remembers pings from the last few minutes so a repeat of the same URL set is skipped.
      # The newest earlier entry is restored; each run saves its own, carrying the records forward.
      - uses: actions/cache@v6
        if: steps.changed.outputs.site == 'true'
        with:
          path: .indexnow-recent
          key: indexnow-recent-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-recent-
      - if: steps.changed.outputs.site == 'true'
        # A deploy, or a manual run with the default inputs, submits only the pages whose lastmod
        # changed (at most 50). Only a manual run with "all" ticked resubmits the whole sitemap.
        env:
          EVENT: ${{ github.event_name }}
          ALL: ${{ inputs.all }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$ALL" = "true" ]; then
            node scripts/indexnow.mjs --all --force --dedup-file=.indexnow-recent/pings.json
          else
            node scripts/indexnow.mjs --from="${FROM:-HEAD~1}" --to="${TO:-HEAD}" --dedup-file=.indexnow-recent/pings.json
          fi
