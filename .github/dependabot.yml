version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # Hold mediabunny and its AC-3 plugin at 1.61.x. 1.62 and later (checked
      # through 1.65.2) stall on WebKit: tests/video-compress-recovery.spec.ts
      # and tests/video-encoder.spec.ts time out on CI. Remove this once those
      # two specs pass on a newer release.
      - dependency-name: "mediabunny"
        versions: [">1.61.0"]
      - dependency-name: "@mediabunny/ac3"
        versions: [">1.61.0"]
      # Hold Playwright at 1.64.1. 1.65.0 (new Chromium) kills the page while
      # the 24 megapixel canvas specs build their input: tests/image-to-ascii.spec.ts:115
      # and tests/compare-images.spec.ts:132 fail with "Execution context was destroyed".
      - dependency-name: "@playwright/test"
        versions: [">1.64.1"]
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        update-types: ["minor", "patch", "major"]
